<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Calculator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #1e3a8a, #0f172a); color: #f8fafc;
  }
  .calc {
    width: 320px; padding: 20px; border-radius: 20px;
    background: #111827; box-shadow: 0 20px 50px rgba(0,0,0,.5);
  }
  .display {
    background: #0b1220; border-radius: 12px; padding: 16px; margin-bottom: 16px;
    text-align: right; min-height: 96px; display: flex; flex-direction: column; justify-content: flex-end;
    overflow: hidden;
  }
  .expr { font-size: 14px; color: #94a3b8; min-height: 18px; word-break: break-all; }
  .result { font-size: 36px; font-weight: 600; word-break: break-all; }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  button {
    height: 60px; border: none; border-radius: 12px; font-size: 20px; cursor: pointer;
    background: #1f2937; color: #f8fafc; transition: background .15s, transform .05s;
  }
  button:hover { background: #374151; }
  button:active { transform: scale(.96); }
  .op { background: #2563eb; } .op:hover { background: #3b82f6; }
  .fn { background: #475569; } .fn:hover { background: #64748b; }
  .eq { background: #16a34a; grid-column: span 2; } .eq:hover { background: #22c55e; }
  .zero { grid-column: span 2; }
  footer { margin-top: 12px; text-align: center; font-size: 12px; color: #64748b; }
</style>
</head>
<body>
<div class="calc">
  <div class="display">
    <div class="expr" id="expr"></div>
    <div class="result" id="result">0</div>
  </div>
  <div class="keys">
    <button class="fn" data-action="clear">AC</button>
    <button class="fn" data-action="back">⌫</button>
    <button class="fn" data-action="percent">%</button>
    <button class="op" data-op="/">÷</button>
    <button data-num="7">7</button><button data-num="8">8</button><button data-num="9">9</button>
    <button class="op" data-op="*">×</button>
    <button data-num="4">4</button><button data-num="5">5</button><button data-num="6">6</button>
    <button class="op" data-op="-">−</button>
    <button data-num="1">1</button><button data-num="2">2</button><button data-num="3">3</button>
    <button class="op" data-op="+">+</button>
    <button class="zero" data-num="0">0</button>
    <button data-num=".">.</button>
    <button class="fn" data-action="sign">±</button>
    <button class="eq" data-action="equals" style="grid-column: span 4;">=</button>
  </div>
  <footer>Simple Calculator · keyboard supported</footer>
</div>
<script>
  const exprEl = document.getElementById('expr');
  const resultEl = document.getElementById('result');
  let current = '0', previous = null, operator = null, justEvaluated = false;
  const symbols = { '+': '+', '-': '−', '*': '×', '/': '÷' };

  function render() {
    resultEl.textContent = current;
    exprEl.textContent = previous !== null && operator ? `${previous} ${symbols[operator]}` : '';
  }
  function compute(a, b, op) {
    a = parseFloat(a); b = parseFloat(b);
    let r;
    switch (op) {
      case '+': r = a + b; break;
      case '-': r = a - b; break;
      case '*': r = a * b; break;
      case '/': if (b === 0) return 'Error'; r = a / b; break;
    }
    return String(parseFloat(r.toPrecision(12)));
  }
  function inputNum(n) {
    if (current === 'Error' || justEvaluated) { current = '0'; justEvaluated = false; }
    if (n === '.' && current.includes('.')) return;
    current = (current === '0' && n !== '.') ? n : current + n;
  }
  function inputOp(op) {
    if (current === 'Error') return;
    if (previous !== null && operator && !justEvaluated) {
      current = compute(previous, current, operator);
      if (current === 'Error') { previous = null; operator = null; render(); return; }
    }
    previous = current; operator = op; current = '0'; justEvaluated = false;
  }
  function equals() {
    if (previous === null || !operator) return;
    exprEl.textContent = `${previous} ${symbols[operator]} ${current} =`;
    current = compute(previous, current, operator);
    previous = null; operator = null; justEvaluated = true;
    resultEl.textContent = current;
  }
  function action(a) {
    if (a === 'clear') { current = '0'; previous = null; operator = null; }
    else if (a === 'back') { current = current.length > 1 && current !== 'Error' ? current.slice(0, -1) : '0'; if (current === '-') current = '0'; }
    else if (a === 'percent') { if (current !== 'Error') current = String(parseFloat(current) / 100); }
    else if (a === 'sign') { if (current !== '0' && current !== 'Error') current = current.startsWith('-') ? current.slice(1) : '-' + current; }
    else if (a === 'equals') { equals(); return; }
    render();
  }
  document.querySelector('.keys').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.num) { inputNum(b.dataset.num); render(); }
    else if (b.dataset.op) { inputOp(b.dataset.op); render(); }
    else if (b.dataset.action) action(b.dataset.action);
  });
  document.addEventListener('keydown', e => {
    if (/^[0-9.]$/.test(e.key)) { inputNum(e.key); render(); }
    else if (['+','-','*','/'].includes(e.key)) { inputOp(e.key); render(); }
    else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); equals(); }
    else if (e.key === 'Backspace') action('back');
    else if (e.key === 'Escape') action('clear');
    else if (e.key === '%') action('percent');
  });
  render();
</script>
</body>
</html>
